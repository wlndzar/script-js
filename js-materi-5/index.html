<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSI Student Management</title>
  <style>
    :root {
      --blue:#1656c1; --blue-dark:#0e3d91; --blue-soft:#edf4ff;
      --gold:#b58b2f; --gold-soft:#fff7df; --white:#fff; --bg:#f4f7fb;
      --text:#1e293b; --muted:#64748b; --border:#dbe4f0;
      --danger:#c63737; --danger-soft:#fff0f0; --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top right,#edf4ff 0,transparent 30%),var(--bg);color:var(--text)}
    button,input{font:inherit} button{cursor:pointer}
    .page{width:min(1050px,calc(100% - 30px));margin:32px auto 50px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px;margin-bottom:20px;color:var(--white);background:linear-gradient(135deg,var(--blue-dark),var(--blue));border-radius:20px}
    .school{display:inline-block;margin-bottom:8px;font-size:13px;font-weight:bold;letter-spacing:.08em;color:#f5d784}
    .header h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}
    .header p{margin:0;max-width:650px;line-height:1.5;color:#dbeafe}
    .phase-badge{flex-shrink:0;padding:12px 16px;border:1px solid rgba(255,255,255,.2);border-radius:14px;text-align:center;font-weight:bold;background:rgba(255,255,255,.1)}
    .concept-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .concept{padding:13px;background:var(--white);border:1px solid var(--border);border-radius:13px;text-align:center;font-weight:bold;font-size:14px}
    .concept span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:normal}
    .app-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
    .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
    .card h2{margin:0 0 18px;color:var(--blue-dark)}
    label{display:block;margin-bottom:7px;font-weight:bold}
    input{width:100%;padding:11px 12px;margin-bottom:15px;border:1px solid #bcc9d9;border-radius:9px;outline:none}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
    .primary-btn{width:100%;padding:12px;border:0;border-radius:10px;color:var(--white);background:var(--blue);font-weight:bold}
    .primary-btn:hover{background:var(--blue-dark)}
    .form-note{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .list-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .list-header h2{margin:0}
    .saved-status{padding:6px 10px;border-radius:999px;color:#76580c;background:var(--gold-soft);font-size:12px;font-weight:bold}
    .student-list{display:grid;gap:10px}
    .student-item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#fbfdff}
    .student-name{font-weight:bold}
    .student-number{display:inline-block;margin-right:7px;color:var(--gold)}
    .score{min-width:58px;padding:7px 10px;border-radius:8px;text-align:center;font-weight:bold;color:var(--blue-dark);background:var(--blue-soft)}
    .delete-btn{border:0;border-radius:8px;padding:8px 10px;color:var(--danger);background:var(--danger-soft);font-weight:bold}
    .empty{padding:28px;border:1px dashed #b9c7d8;border-radius:12px;text-align:center;color:var(--muted);background:#fbfdff}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
    .stat-box{padding:18px;border-radius:13px;text-align:center;color:var(--blue-dark);background:var(--blue-soft)}
    .stat-box span{display:block;margin-bottom:5px;color:var(--muted);font-size:13px}
    .stat-box strong{font-size:30px}
    @media(max-width:800px){.app-grid{grid-template-columns:1fr}.concept-row{grid-template-columns:repeat(2,1fr)}.header{align-items:flex-start;flex-direction:column}}
    @media(max-width:520px){.page{width:min(100% - 18px,1050px);margin-top:15px}.concept-row{grid-template-columns:1fr}.student-item{grid-template-columns:1fr auto}.score{grid-column:2;grid-row:1}.delete-btn{grid-column:1/-1}}
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <span class="school">HSI BOARDING SCHOOL • WEB PROGRAMMING</span>
        <h1>🎓 HSI Student Management</h1>
      </div>
      <div class="phase-badge">Phase 4<br>Dynamic UI + Storage</div>
    </header>

    <section class="app-grid">
      <section class="card">
        <h2>➕ Tambah Siswa</h2>
        <form id="studentForm">
          <label for="studentName">Nama Siswa</label>
          <input id="studentName" type="text" placeholder="Contoh: Ahmad" autocomplete="off" required>

          <label for="studentScore">Nilai</label> 
          <input id="studentScore" type="number" min="0" max="100" placeholder="0 - 100" required>

          <button class="primary-btn" type="submit">➕ Tambah Siswa</button>
        </form>
        <p class="form-note">💡 Data yang ditambahkan akan masuk ke array JavaScript, kemudian UI dirender ulang dan disimpan ke browser.</p>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>📋 Daftar Siswa</h2>
          <span class="saved-status">💾 LocalStorage</span>
        </div>

        <div id="studentList" class="student-list"></div>

        <div class="stats">
          <div class="stat-box"><span>Total Siswa</span><strong id="totalStudents">0</strong></div>
          <div class="stat-box"><span>Rata-rata Nilai</span><strong id="averageScore">0</strong></div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
