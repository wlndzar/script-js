<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeFood — Cari Resep</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <circle cx="16" cy="16" r="16" fill="#fff"/>
              <path d="M9 18.5c0-3.6 2.4-6.5 7-6.5s7 2.9 7 6.5c0 1.2-.4 2.2-1 3H10c-.6-.8-1-1.8-1-3z" fill="#EE4D2D"/>
              <path d="M12 12.2c.4-1.6 1.8-2.7 4-2.7s3.6 1.1 4 2.7" fill="none" stroke="#EE4D2D" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="13.2" cy="18.2" r="1" fill="#fff"/>
              <circle cx="18.8" cy="18.2" r="1" fill="#fff"/>
            </svg>
          </span>
          <div>
            <h1>RecipeFood</h1>
            <p class="loc">Resep dari DummyJSON · siap dimasak</p>
          </div>
        </div>
        <button class="icon-btn" type="button" aria-label="Keranjang">

        </button>
      </div>

      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#EE4D2D" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="search-input" type="search" placeholder="Cari resep, masakan, atau bahan..." autocomplete="off">
        <button type="submit" class="search-btn">Cari</button>
      </form>
    </header>

    <main>
      <section class="promo" aria-label="Promo">
        <div class="promo-card">
          <div>
            <span class="promo-tag">Gratis ongkir resep</span>
            <strong>Temukan menu favoritmu hari ini</strong>
            <p>50+ resep dari berbagai negara, tinggal pilih.</p>
          </div>
          <span class="promo-emoji" aria-hidden="true">🍜</span>
        </div>
      </section>

  <div class="filter">    
    <select id="cuisine-filter">
      <option value="all">Semua asal</option>
      <option>Italian</option>
      <option>Asian</option>
      <option>Pakistani</option>
      <option>American</option>
      <option>Greek</option>
      <option>Brazilian</option>
      <option>Indian</option>
      <option>Japanese</option>
      <option>Korean</option>
      <option>Lebanese</option>
      <option>Mexican</option>
      <option>Moroccan</option>
      <option>Russian</option>
      <option>Smoothie</option>
      <option>Thai</option>
      <option>Turkish</option>
      <option>Mediterranean</option>
    </select>

    <select id="difficulty-filter">
      <option value="all">Semua tingkat</option>
      <option>Easy</option>
      <option>Medium</option>
    </select>
</div>
      <section class="list-section">
        <div class="section-head">
          <h2>Rekomendasi Untukmu</h2>
          <span id="result-count">Memuat resep...</span>
        </div>

        <div id="status" class="status" hidden></div>
        <div id="recipe-grid" class="grid" aria-live="polite"></div>
      </section>
    </main>

  <nav class="bottom-nav" aria-label="Navigasi">

  <button
    class="nav-item active"
    id="home-nav"
    type="button"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
      <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/>
    </svg>

    <span>Beranda</span>
  </button>


  <button
    class="nav-item"
    id="favorite-nav"
    type="button"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/>
    </svg>

    <span>Favorit</span>
  </button>

  </nav>
</div>

  <dialog id="detail" class="detail">
    <div class="detail-sheet">
      <button class="close-detail" type="button" id="close-detail" aria-label="Tutup">×</button>
      <div id="detail-body"></div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
